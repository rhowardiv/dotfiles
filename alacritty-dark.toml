[general]
  live_config_reload = true

[env]
  TERM = 'xterm-256color'

[font]
size = 13

[font.normal]
  family = 'Inconsolata'
  style = 'Medium'

[window]
  decorations = 'None'

# Colors (PaperColor - Light)

# Default colors
[colors.primary]
background = '#282828'
foreground = '#928374'

# Normal colors
[colors.normal]
black   = '#282828'
red     = '#cc241d'
green   = '#98971a'
yellow  = '#d79921'
blue    = '#458588'
magenta = '#b16286'
cyan    = '#689d6a'
white   = '#a89984'

# Bright colors
[colors.bright]
black   = '#ffffff'
red     = '#fb4934'
green   = '#b8bb26'
yellow  = '#fabd2f'
blue    = '#83a598'
magenta = '#d3869b'
cyan    = '#8ec07c'
white   = '#ebdbb2'

